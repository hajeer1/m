<script>
    var cacheObj = window.applicationCache;
    var msgs = document.getElementById('msgs');

    function handleCacheEvent(e) {
        switch (cacheObj.status) {
            case cacheObj.CHECKING:
                msgs.innerHTML = "Checking Cache Status...";
                break;
            case cacheObj.DOWNLOADING:
                msgs.innerHTML = "Downloading Cache Files... Please Wait";
                break;
            case cacheObj.UPDATEREADY:
                cacheObj.swapCache();
                msgs.innerHTML = "Cache Installed Successfully! - Please Close and Re-Open Browser.";
                break;
            case cacheObj.CACHED:
                msgs.innerHTML = "Cache Installed Successfully! - Please Close and Re-Open Browser.";
                break;
            case cacheObj.OBSOLETE:
                msgs.innerHTML = "Cache Obsolete. Refresh page.";
                break;
            case cacheObj.ERROR:
                msgs.innerHTML = "Error loading cache! Check manifest or network.";
                break;
        }
    }

    cacheObj.addEventListener('checking', handleCacheEvent, false);
    cacheObj.addEventListener('downloading', handleCacheEvent, false);
    cacheObj.addEventListener('progress', function(e) {
        var percent = e.lengthComputable ? Math.round((e.loaded / e.total) * 100) : "";
        msgs.innerHTML = "Downloading Cache... " + percent + "% (" + e.loaded + " of " + e.total + ")";
    }, false);
    cacheObj.addEventListener('cached', handleCacheEvent, false);
    cacheObj.addEventListener('updateready', handleCacheEvent, false);
    cacheObj.addEventListener('error', handleCacheEvent, false);
    cacheObj.addEventListener('noupdate', function() {
        msgs.innerHTML = "Cache is up to date. Ready to use!";
    }, false);

    // التحقق الفوري إذا كان الكاش منتهي ومحفوظ مسبقاً
    if (cacheObj.status === cacheObj.READY) {
        msgs.innerHTML = "Cache is Ready! - Please Close and Re-Open Browser.";
    }
</script>
